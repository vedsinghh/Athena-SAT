<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset your Athena SAT password</title>
  <!-- Paste into Supabase → Authentication → Email Templates → Reset password -->
</head>
<body style="margin:0;padding:0;background-color:#e8f0ff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#e8f0ff;">
    <tr>
      <td align="center" style="padding:32px 16px 40px;">

        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:560px;">
          <tr>
            <td align="center" style="padding-bottom:18px;">
              <div style="font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:700;letter-spacing:0.18em;color:#315bb7;">ATHENA</div>
              <div style="margin-top:6px;font-size:11px;font-weight:700;letter-spacing:0.32em;color:#e8a93e;">— SAT —</div>
            </td>
          </tr>
        </table>

        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:560px;background-color:#ffffff;border-radius:24px;overflow:hidden;box-shadow:0 18px 50px rgba(18,52,111,0.12);">
          <tr>
            <td style="background:linear-gradient(165deg,#b9dcfa 0%,#f6f3ec 100%);padding:32px 36px 16px;text-align:center;">
              <div style="font-size:48px;line-height:1;">🛡️</div>
              <h1 style="margin:12px 0 0;font-family:Georgia,'Times New Roman',serif;font-size:26px;color:#12346f;">
                Reset your password
              </h1>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 36px 32px;text-align:center;">
              <p style="margin:0 0 22px;font-size:16px;line-height:1.6;color:#687590;">
                We got a request to reset the password for <strong style="color:#12346f;">{{ .Email }}</strong>.
                Tap below to choose a new one and get back to practice.
              </p>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto 24px;">
                <tr>
                  <td align="center" style="border-radius:999px;background-color:#2f62d6;box-shadow:0 10px 28px rgba(47,98,214,0.35);">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block;padding:16px 36px;font-size:16px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:999px;">
                      Reset password →
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:0;font-size:13px;line-height:1.55;color:#8a95a8;">
                Didn’t ask for this? Ignore this email — your password stays the same.<br />
                <a href="{{ .ConfirmationURL }}" style="color:#2f62d6;word-break:break-all;">{{ .ConfirmationURL }}</a>
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 36px 24px;background-color:#f6f3ec;border-top:1px solid #ebe6dc;text-align:center;">
              <p style="margin:0;font-size:12px;font-weight:600;color:#62718f;">© Athena SAT</p>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
