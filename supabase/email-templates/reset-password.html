<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Reset your Athena SAT password</title>
  <!-- Paste this entire file into Supabase → Authentication → Email Templates → Reset password -->
</head>
<body style="margin:0;padding:0;background-color:#f6f3ec;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">
    Reset your Athena SAT password to get back to practice.
  </div>

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f6f3ec;">
    <tr>
      <td align="center" style="padding:48px 24px 56px;">

        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:480px;">

          <!-- Favicon -->
          <tr>
            <td align="center" style="padding-bottom:32px;">
              <img
                src="https://athenasat.app/favicon.png"
                alt="Athena SAT"
                width="48"
                height="48"
                style="display:block;margin:0 auto;border:0;border-radius:10px;outline:none;text-decoration:none;"
              />
            </td>
          </tr>

          <!-- Heading -->
          <tr>
            <td align="center" style="padding-bottom:16px;">
              <h1 style="margin:0;font-size:28px;line-height:1.25;font-weight:700;color:#12346f;">
                Reset your password
              </h1>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td align="center" style="padding-bottom:32px;">
              <p style="margin:0;font-size:16px;line-height:1.6;color:#687590;">
                We received a request to reset your Athena SAT password. To choose a new one, please click the button below.
              </p>
            </td>
          </tr>

          <!-- CTA -->
          <tr>
            <td align="center" style="padding-bottom:48px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td align="center" style="border-radius:999px;background-color:#ffffff;">
                    <a
                      href="{{ .ConfirmationURL }}"
                      target="_blank"
                      style="display:block;padding:14px 24px;font-size:16px;font-weight:700;color:#12346f;text-decoration:none;border-radius:999px;"
                    >
                      Reset password
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Fallback link -->
          <tr>
            <td align="center" style="padding-bottom:48px;">
              <p style="margin:0;font-size:13px;line-height:1.55;color:#8a95a8;">
                Button not working? Copy and paste this link:<br />
                <a href="{{ .ConfirmationURL }}" style="color:#2f62d6;word-break:break-all;">{{ .ConfirmationURL }}</a>
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center">
              <p style="margin:0;font-size:13px;line-height:1.5;color:#8a95a8;">
                - the athena sat team
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>
</body>
</html>
